<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TRON Watchlist</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --bg: #0b0f14;
      --panel: #111821;
      --panel-soft: #151e2a;
      --border: #263241;
      --text: #e8eef7;
      --muted: #8c9bab;
      --accent: #f6a313;
      --green: #10b981;
      --blue: #2563eb;
      --red: #ef4444;
      --row-hover: #1b2634;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: linear-gradient(180deg, #070a0f 0%, #0b0f14 100%);
      color: var(--text);
      padding: 32px;
    }

    .app {
      max-width: 1280px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 28px;
    }

    .title-block h1 {
      margin: 0 0 8px;
      font-size: 32px;
      letter-spacing: -0.03em;
      color: var(--accent);
    }

    .title-block p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      opacity: 0.92;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-refresh {
      background: var(--green);
    }

    .btn-copy {
      background: var(--blue);
    }

    .status {
      margin-bottom: 18px;
      font-size: 14px;
      color: var(--muted);
    }

    .status.success {
      color: var(--green);
    }

    .status.error {
      color: var(--red);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(160px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
    }

    .card-label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
    }

    .card-value {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .table-wrap {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background: var(--panel-soft);
      color: var(--muted);
      text-align: left;
      padding: 14px 16px;
      font-size: 13px;
      font-weight: 600;
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      white-space: nowrap;
    }

    tr:hover td {
      background: var(--row-hover);
    }

    tr:last-child td {
      border-bottom: none;
    }

    a {
      color: #60a5fa;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .money {
      font-weight: 700;
      color: #ffffff;
    }

    .empty {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      color: var(--muted);
      text-align: center;
    }

    .footer-note {
      margin-top: 14px;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 900px) {
      body {
        padding: 20px;
      }

      .header {
        flex-direction: column;
      }

      .cards {
        grid-template-columns: repeat(2, 1fr);
      }

      .table-wrap {
        overflow-x: auto;
      }
    }

    @media (max-width: 520px) {
      .cards {
        grid-template-columns: 1fr;
      }

      .title-block h1 {
        font-size: 26px;
      }

      button {
        width: 100%;
      }

      .actions {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <section class="header">
      <div class="title-block">
        <h1>TRON Watchlist</h1>
        <p>Wallets with TRX + USDT balance above $50,000</p>
      </div>

      <div class="actions">
        <button class="btn-refresh" id="checkBtn" onclick="checkBalances()">
          Refresh
        </button>

        <button class="btn-copy" id="copyBtn" onclick="copyValidAddresses()" disabled>
          Copy addresses
        </button>
      </div>
    </section>

    <div id="status" class="status">Loading...</div>

    <section id="cards" class="cards" style="display:none;">
      <div class="card">
        <div class="card-label">Matched wallets</div>
        <div class="card-value" id="matchedCount">0</div>
      </div>

      <div class="card">
        <div class="card-label">Total shown value</div>
        <div class="card-value" id="totalValue">$0.00</div>
      </div>

      <div class="card">
        <div class="card-label">TRX price</div>
        <div class="card-value" id="trxPrice">$0.00</div>
      </div>

      <div class="card">
        <div class="card-label">Checked addresses</div>
        <div class="card-value" id="checkedCount">0</div>
      </div>
    </section>

    <div id="emptyMessage" class="empty" style="display:none;">
      No wallets above the selected threshold.
    </div>

    <section id="tableWrap" class="table-wrap" style="display:none;">
      <table>
        <thead>
          <tr>
            <th>Address</th>
            <th>TRX</th>
            <th>TRX USD</th>
            <th>USDT</th>
            <th>USDT USD</th>
            <th>Total USD</th>
          </tr>
        </thead>
        <tbody id="results"></tbody>
      </table>
    </section>

    <div class="footer-note">
      Data updates when you open the page or click Refresh.
    </div>
  </main>

  <script>
    const MIN_TOTAL_USD = 50000;

    const WATCHED_ADDRESSES = [
      "TCw2NHiW2krQv6r7d3jyCuoWPZgsci4p9E",
      "TQVJdnPiyqZqp4cBy445jofu66a99C2SAZ",
      "TD9bq45U5hLtdK4JhGspYKPEVwzYwGFFK4",
      "TNvS9f5HY5ZAo4eqZAE5sYAirueEbGs9ZA",
      "TDbhb5MhJWKPcpdayqtZUUJ37M3exZ4pzc",
      "TFHfTY488RtqwQsQoZPr3zY4KqHjBKcL3e",
      "TQYJEL54E3MXahDsDJoJYqqv2y1uTjS5gD",
      "TUWXvrMfT39AoXgDCwXBrLpiedZDoH8Ndc",
      "TSBTdYkJoBiq3LpoTykKdvm2XpKHqTPFyg",
      "TSMyMBSmnXoTDxDtaXiYGFZRLFXbHD5qV8"
    ];

    const USDT_CONTRACT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";

    let validAddresses = [];

    function extractAddress(text) {
      const match = text.match(/T[A-Za-z0-9]{33}/);
      return match ? match[0] : null;
    }

    function formatUsd(value) {
      return "$" + Number(value).toLocaleString("en-US", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function formatToken(value) {
      return Number(value).toLocaleString("en-US", {
        minimumFractionDigits: 6,
        maximumFractionDigits: 6
      });
    }

    function setStatus(message, type = "") {
      const status = document.getElementById("status");
      status.textContent = message;
      status.className = "status";
      if (type) status.classList.add(type);
    }

    async function getPrices() {
      const url = "https://api.coingecko.com/api/v3/simple/price?ids=tron,tether&vs_currencies=usd";
      const response = await fetch(url);

      if (!response.ok) {
        throw new Error("Price request failed.");
      }

      const data = await response.json();

      return {
        trx: Number(data.tron.usd),
        usdt: Number(data.tether.usd)
      };
    }

    async function getWalletFromTronGrid(address) {
      const url = `https://api.trongrid.io/v1/accounts/${address}`;
      const response = await fetch(url);

      if (!response.ok) {
        throw new Error("TronGrid request failed.");
      }

      const data = await response.json();

      if (!data.data || data.data.length === 0) {
        return { trx: 0, usdt: 0 };
      }

      const account = data.data[0];

      const trx = account.balance ? Number(account.balance) / 1_000_000 : 0;

      let usdt = 0;

      if (Array.isArray(account.trc20)) {
        for (const tokenObj of account.trc20) {
          if (tokenObj[USDT_CONTRACT] !== undefined) {
            usdt = Number(tokenObj[USDT_CONTRACT]) / 1_000_000;
            break;
          }
        }
      }

      return { trx, usdt };
    }

    async function getWalletFromTronScan(address) {
      const url = `https://apilist.tronscanapi.com/api/account?address=${address}`;
      const response = await fetch(url);

      if (!response.ok) {
        throw new Error("TronScan request failed.");
      }

      const data = await response.json();

      const trx = data.balance ? Number(data.balance) / 1_000_000 : 0;

      let usdt = 0;

      const tokenLists = [
        data.trc20token_balances,
        data.tokenBalances,
        data.tokens
      ];

      for (const list of tokenLists) {
        if (!Array.isArray(list)) continue;

        for (const token of list) {
          const tokenAddress =
            token.tokenId ||
            token.contract_address ||
            token.contractAddress ||
            token.tokenAddress;

          const tokenSymbol =
            token.tokenAbbr ||
            token.symbol ||
            token.tokenName;

          if (tokenAddress === USDT_CONTRACT || tokenSymbol === "USDT") {
            const rawBalance =
              token.balance ||
              token.amount ||
              token.quantity ||
              0;

            const decimals =
              token.tokenDecimal !== undefined
                ? Number(token.tokenDecimal)
                : token.decimals !== undefined
                  ? Number(token.decimals)
                  : 6;

            usdt = Number(rawBalance) / Math.pow(10, decimals);
            break;
          }
        }

        if (usdt > 0) break;
      }

      return { trx, usdt };
    }

    async function getWalletBalance(address) {
      try {
        const tronGridData = await getWalletFromTronGrid(address);

        if (tronGridData.trx > 0 || tronGridData.usdt > 0) {
          return tronGridData;
        }
      } catch (error) {
        console.warn("TronGrid failed:", address, error);
      }

      try {
        return await getWalletFromTronScan(address);
      } catch (error) {
        console.warn("TronScan failed:", address, error);
      }

      return { trx: 0, usdt: 0 };
    }

    async function checkBalances() {
      const checkBtn = document.getElementById("checkBtn");
      const copyBtn = document.getElementById("copyBtn");
      const cards = document.getElementById("cards");
      const tableWrap = document.getElementById("tableWrap");
      const emptyMessage = document.getElementById("emptyMessage");
      const tbody = document.getElementById("results");

      checkBtn.disabled = true;
      copyBtn.disabled = true;

      validAddresses = [];
      tbody.innerHTML = "";

      cards.style.display = "none";
      tableWrap.style.display = "none";
      emptyMessage.style.display = "none";

      try {
        let addresses = WATCHED_ADDRESSES
          .map(item => extractAddress(item))
          .filter(Boolean);

        addresses = [...new Set(addresses)];

        if (addresses.length === 0) {
          setStatus("No valid addresses.", "error");
          return;
        }

        setStatus("Updating balances...");

        const prices = await getPrices();

        let visibleCount = 0;
        let checkedCount = 0;
        let totalVisibleUsd = 0;

        for (const address of addresses) {
          checkedCount++;
          setStatus(`Checking ${checkedCount}/${addresses.length}`);

          const wallet = await getWalletBalance(address);

          const trx = wallet.trx;
          const usdt = wallet.usdt;

          const trxUsd = trx * prices.trx;
          const usdtUsd = usdt * prices.usdt;
          const totalUsd = trxUsd + usdtUsd;

          if (totalUsd > MIN_TOTAL_USD) {
            visibleCount++;
            totalVisibleUsd += totalUsd;
            validAddresses.push(address);

            const row = document.createElement("tr");

            row.innerHTML = `
              <td>
                <a href="https://tronscan.org/#/address/${address}" target="_blank">
                  ${address}
                </a>
              </td>
              <td>${formatToken(trx)}</td>
              <td>${formatUsd(trxUsd)}</td>
              <td>${formatToken(usdt)}</td>
              <td>${formatUsd(usdtUsd)}</td>
              <td class="money">${formatUsd(totalUsd)}</td>
            `;

            tbody.appendChild(row);
          }
        }

        document.getElementById("matchedCount").textContent = visibleCount;
        document.getElementById("totalValue").textContent = formatUsd(totalVisibleUsd);
        document.getElementById("trxPrice").textContent = formatUsd(prices.trx);
        document.getElementById("checkedCount").textContent = checkedCount;

        cards.style.display = "grid";

        if (visibleCount > 0) {
          tableWrap.style.display = "block";
          copyBtn.disabled = false;
        } else {
          emptyMessage.style.display = "block";
        }

        setStatus("Updated.", "success");

      } catch (error) {
        console.error(error);
        setStatus(error.message || "Something went wrong.", "error");
      } finally {
        checkBtn.disabled = false;
      }
    }

    async function copyValidAddresses() {
      if (validAddresses.length === 0) {
        setStatus("No addresses to copy.", "error");
        return;
      }

      try {
        await navigator.clipboard.writeText(validAddresses.join("\n"));
        setStatus(`Copied ${validAddresses.length} address(es).`, "success");
      } catch (error) {
        setStatus("Copy failed. Select addresses manually.", "error");
      }
    }

    window.addEventListener("load", checkBalances);
  </script>
</body>
</html>
